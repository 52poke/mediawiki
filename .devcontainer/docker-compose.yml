services:
  wiki-52poke:
    container_name: wiki-52poke-dev
    build:
      context: .
      args:
        USER_ID: "1000"
        GROUP_ID: "1000"
    volumes:
      - ../:/home/52poke/wiki:cached
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:cached
      - ../docker/php.ini:/usr/local/etc/php/php.ini:cached
      - ../docker/supervisord.conf:/etc/supervisor/supervisord.conf:cached
    ports:
      - 8227:80
  poolcounter:
    container_name: poolcounter-dev
    image: ghcr.io/52poke/poolcounter:latest
    command: -l 0.0.0.0
    ports:
      - 7531:7531
