x-podman:
  in_pod: false

services:
  wiki-52poke:
    container_name: wiki-52poke-dev
    build:
      context: .
      args:
        - USER_ID=1000
        - GROUP_ID=1000
    volumes:
      - ../:/home/52poke/wiki:cached,z
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:cached,z
      - ../docker/php.ini:/usr/local/etc/php/php.ini:cached,z
      - ../docker/supervisord.conf:/etc/supervisor/supervisord.conf:cached,z
    ports:
      - 8227:80
    userns_mode: "keep-id:uid=1000,gid=1000"
    depends_on:
      - memcached
  memcached:
    container_name: memcached-dev
    image: ${MEMCACHED_IMAGE:-docker.io/library/memcached:1.6.45}
