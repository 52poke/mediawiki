x-podman:
  in_pod: false

services:
  wiki-52poke:
    container_name: wiki-52poke-dev
    build:
      context: .
      args:
        - USER_ID=1000
        - GROUP_ID=1000
    volumes:
      - ../:/home/52poke/wiki:cached,z
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:cached,z
      - ../docker/php.ini:/usr/local/etc/php/php.ini:cached,z
      - ../docker/supervisord.conf:/etc/supervisor/supervisord.conf:cached,z
    ports:
      - 8227:80
    userns_mode: "keep-id:uid=1000,gid=1000"
    depends_on:
      - elasticsearch
      - kafka
      - memcached
  elasticsearch:
    container_name: elasticsearch-dev
    image: ghcr.io/52poke/52w-elasticsearch:latest
    environment:
      ES_JAVA_OPTS: -Xmx384m -Xms384m
      discovery.type: single-node
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
  kafka:
    container_name: kafka-dev
    image: docker.io/bitnamilegacy/kafka:3.8.0
    # Override both values in the gitignored .devcontainer/.env when Kafka
    # consumers run outside this Compose project.
    ports:
      - ${KAFKA_BIND_ADDRESS:-127.0.0.1}:9092:29092
    environment:
      KAFKA_HEAP_OPTS: -Xmx256m -Xms256m
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:9092
      KAFKA_CFG_LOG_RETENTION_HOURS: "24"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka-data:/bitnami/kafka
  memcached:
    container_name: memcached-dev
    image: ${MEMCACHED_IMAGE:-docker.io/library/memcached:1.6.45}

volumes:
  elasticsearch-data:
    name: 52poke-mediawiki-elasticsearch-data
  kafka-data:
    name: 52poke-mediawiki-kafka-data
