name: Build Docker image and publish to GitHub Container Registry

on:
  push:
    branches: 52w

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Use GitHub mirror for nested VisualEditor submodule
      run: git config --global url."https://github.com/wikimedia/VisualEditor.git".insteadOf https://gerrit.wikimedia.org/r/VisualEditor/VisualEditor.git
    - name: Checkout
      uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v1
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.CR_PAT }}
    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: .
        file: ./docker/Dockerfile
        platforms: linux/amd64
        push: true
        tags: |
          ghcr.io/${{ github.repository }}:latest
